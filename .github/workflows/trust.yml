name: trust

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  trust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" ruff
      - name: SpecSync lifecycle gate
        uses: CorvidLabs/spec-sync@3c2ed4972c8c53ae02ab5dd5775beccd6da3eeb8 # v6.0.0
        with:
          version: "6.0.0"
          root: .
          strict: "true"
          require-coverage: "100"
          lifecycle-enforce: "true"
      - name: CorvidLabs Trust gate
        id: trust
        uses: CorvidLabs/trust@fcc889f54d8b4892a81af463c5a0250e2be66fc5 # v1.2.0
